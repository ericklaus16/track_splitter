name: Build and Release

on:
  push:
    tags:
      - 'v*' # Dispara quando uma tag como v1.0.3 for enviada

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
      fail-fast: false

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ "$RUNNER_OS" == "Linux" ]; then
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
        fi
        pip install -r requirements.txt
        pip install pyinstaller
      shell: bash

    - name: Build Executable
      run: python build.py

    - name: Zip Full Application (Windows)
      if: runner.os == 'Windows'
      run: |
        Compress-Archive -Path dist\TrackSplitter -DestinationPath TrackSplitter-Windows-Full.zip
        Compress-Archive -Path dist\TrackSplitter\TrackSplitter.exe -DestinationPath TrackSplitter-Windows-Patch.zip

    - name: Zip Full Application (Mac)
      if: runner.os == 'macOS'
      run: |
        cd dist
        zip -r ../TrackSplitter-Mac-Full.zip TrackSplitter.app
        cd TrackSplitter.app/Contents/MacOS
        zip ../../../../TrackSplitter-Mac-Patch.zip TrackSplitter

    - name: Zip Full Application (Linux)
      if: runner.os == 'Linux'
      run: |
        cd dist
        zip -r ../TrackSplitter-Linux-Full.zip TrackSplitter
        cd TrackSplitter
        zip ../../TrackSplitter-Linux-Patch.zip TrackSplitter

    - name: Upload Artifacts to Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          TrackSplitter-*-Full.zip
          TrackSplitter-*-Patch.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
